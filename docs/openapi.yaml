components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100
    offset:
      name: offset
      in: query
      schema:
        type: integer
        default: 0

  schemas:
    # ==================== AUTH ====================
    RegisterRequest:
      type: object
      required: [email, password, name, deviceToken]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string
        deviceToken:
          type: string
          description: FCM/APNS token

    PartnerRegisterRequest:
      type: object
      required: [email, password, name, phone, companyName, inn, establishmentName, establishmentAddress, deviceToken]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string
          description: ФИО контактного лица
        phone:
          type: string
        companyName:
          type: string
          description: Название юр. лица
        inn:
          type: string
        establishmentName:
          type: string
          description: Публичное название заведения
        establishmentAddress:
          type: string
        description:
          type: string
        deviceToken:
          type: string
          description: FCM/APNS token

    LoginRequest:
      type: object
      required: [email, password, deviceToken]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        deviceToken:
          type: string

    RequestEmailVerificationRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    RequestEmailVerificationResponse:
      type: object
      properties:
        message:
          type: string
        expiresIn:
          type: integer
          description: Секунды до истечения кода
          example: 600

    VerifyEmailRequest:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          format: email
        code:
