basePath: /api/v1
definitions:
  analytics.AnalyticsSummary:
    properties:
      cancelRate:
        type: number
      cancelledOrders:
        type: integer
      categoryBreakdown:
        items:
          $ref: '#/definitions/analytics.CategoryStat'
        type: array
      completedOrders:
        type: integer
      conversionRate:
        type: number
      expiredOrders:
        type: integer
      grossRevenue:
        type: number
      netPayout:
        type: number
      serviceFee:
        type: number
      totalBookings:
        type: integer
    type: object
  analytics.CategoryStat:
    properties:
      grossRevenue:
        type: number
      name:
        type: string
    type: object
  auth.AuthResponse:
    properties:
      accessToken:
        type: string
      expiresIn:
        type: integer
      refreshToken:
        type: string
      user:
        $ref: '#/definitions/auth.UserResponse'
    type: object
  auth.ChangePasswordRequest:
    properties:
      currentPassword:
        type: string
      newPassword:
        minLength: 8
        type: string
    required:
    - currentPassword
    - newPassword
    type: object
  auth.DeleteAccountRequest:
    properties:
      password:
        type: string
    type: object
  auth.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  auth.ForgotPasswordResponse:
    properties:
      expiresIn:
        type: integer
      message:
        type: string
    type: object
  auth.LoginRequest:
    properties:
      deviceToken:
        type: string
      email:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  auth.OAuthRequest:
    properties:
      deviceToken:
        type: string
      idToken:
        type: string
      provider:
        enum:
        - google
        - apple
        type: string
    required:
    - idToken
    - provider
    type: object
  auth.OAuthResponse:
    properties:
      accessToken:
        type: string
      expiresIn:
        type: integer
      isNewUser:
        type: boolean
      refreshToken:
        type: string
      user:
        $ref: '#/definitions/auth.UserResponse'
    type: object
  auth.PartnerRegisterRequest:
    properties:
      companyName:
        type: string
      description:
        type: string
      deviceToken:
        type: string
      email:
        type: string
      establishmentAddress:
        type: string
      establishmentName:
        type: string
      inn:
        type: string
      name:
        type: string
      password:
        minLength: 8
        type: string
      phone:
        type: string
    required:
    - companyName
    - email
    - establishmentAddress
    - establishmentName
    - inn
    - name
    - password
    - phone
    type: object
  auth.RefreshRequest:
    properties:
      refreshToken:
        type: string
    required:
    - refreshToken
    type: object
  auth.RegisterRequest:
    properties:
      deviceToken:
        type: string
      email:
        type: string
      name:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  auth.ResetPasswordRequest:
    properties:
      newPassword:
        minLength: 8
        type: string
      resetToken:
        type: string
    required:
    - newPassword
    - resetToken
    type: object
  auth.TokenResponse:
    properties:
      accessToken:
        type: string
      expiresIn:
        type: integer
      refreshToken:
        type: string
    type: object
  auth.UserResponse:
    properties:
      authProvider:
        type: string
      createdAt:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      partnerStatus:
        type: string
      role:
        type: string
    type: object
  auth.VerifyResetCodeRequest:
    properties:
      code:
        type: string
      email:
        type: string
    required:
    - code
    - email
    type: object
  auth.VerifyResetCodeResponse:
    properties:
      resetToken:
        type: string
    type: object
  categories.CreateCategoryRequest:
    properties:
      icon_url:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  domain.Category:
    properties:
      icon_url:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  domain.Notification:
    properties:
      created_at:
        type: string
      id:
        type: string
      message:
        type: string
      user_id:
        type: string
    type: object
  offers.CategoryDTO:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  offers.CreateOfferRequest:
    properties:
      categoryId:
        type: string
      description:
        type: string
      imageUrl:
        type: string
      originalPrice:
        type: number
      pickupEnd:
        type: string
      pickupStart:
        type: string
      price:
        type: number
      quantity:
        minimum: 1
        type: integer
      title:
        type: string
    required:
    - categoryId
    - originalPrice
    - pickupEnd
    - pickupStart
    - price
    - quantity
    - title
    type: object
  offers.OfferDetailDTO:
    properties:
      category:
        $ref: '#/definitions/offers.CategoryDTO'
      description:
        type: string
      discount:
        type: integer
      id:
        type: string
      imageUrl:
        type: string
      isActive:
        type: boolean
      originalPrice:
        type: number
      pickupEnd:
        type: string
      pickupStart:
        type: string
      price:
        type: number
      quantityAvailable:
        type: integer
      quantityTotal:
        type: integer
      restaurant:
        $ref: '#/definitions/offers.RestaurantShortDTO'
      title:
        type: string
    type: object
  offers.RestaurantShortDTO:
    properties:
      address:
        type: string
      id:
        type: string
      latitude:
        type: number
      longitude:
        type: number
      name:
        type: string
      phone:
        type: string
    type: object
  offers.UpdateOfferRequest:
    properties:
      description:
        type: string
      isActive:
        type: boolean
      price:
        type: number
      quantity:
        type: integer
      title:
        type: string
    type: object
  orders.CancelOrderRequest:
    properties:
      reason:
        type: string
    type: object
  orders.CancelOrderResponse:
    properties:
      cancelledAt:
        type: string
      id:
        type: string
      refundAmount:
        type: number
      status:
        type: string
    type: object
  orders.CreateOrderRequest:
    properties:
      offerId:
        type: string
    required:
    - offerId
    type: object
  orders.CreateOrderResponse:
    properties:
      amount:
        type: number
      expiresAt:
        type: string
      id:
        type: string
      offer:
        $ref: '#/definitions/orders.OfferShortDTO'
      restaurant:
        $ref: '#/definitions/orders.RestaurantSimpleDTO'
      status:
        type: string
    type: object
  orders.OfferDetailInternalDTO:
    properties:
      description:
        type: string
      discount:
        type: integer
      distance:
        type: integer
      id:
        type: string
      imageUrl:
        type: string
      originalPrice:
        type: number
      pickupEnd:
        type: string
      pickupStart:
        type: string
      price:
        type: number
      quantityAvailable:
        type: integer
      restaurantId:
        type: string
      restaurantName:
        type: string
      title:
        type: string
    type: object
  orders.OfferShortDTO:
    properties:
      id:
        type: string
      pickupEnd:
        type: string
      pickupStart:
        type: string
      title:
        type: string
    type: object
  orders.OrderDetailDTO:
    properties:
      amount:
        type: number
      cancellationReason:
        type: string
      cancelledAt:
        type: string
      completedAt:
        type: string
      createdAt:
        type: string
      expiresAt:
        type: string
      id:
        type: string
      offer:
        $ref: '#/definitions/orders.OfferDetailInternalDTO'
      orderNumber:
        type: string
      paidAt:
        type: string
      restaurant:
        $ref: '#/definitions/orders.RestaurantShortDTO'
      status:
        type: string
    type: object
  orders.PayOrderResponse:
    properties:
      id:
        type: string
      orderNumber:
        type: string
      paidAt:
        type: string
      status:
        type: string
    type: object
  orders.RestaurantShortDTO:
    properties:
      address:
        type: string
      id:
        type: string
      latitude:
        type: number
      longitude:
        type: number
      name:
        type: string
      phone:
        type: string
    type: object
  orders.RestaurantSimpleDTO:
    properties:
      address:
        type: string
      name:
        type: string
    type: object
  orders.UserStatsResponse:
    properties:
      savedBoxes:
        type: integer
      savedMoney:
        type: number
    type: object
  restaurants.Pagination:
    properties:
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  restaurants.PartnerRestaurantUpdateRequest:
    properties:
      description:
        type: string
      imageUrl:
        type: string
      workingHours:
        type: string
    type: object
  restaurants.RestaurantListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/restaurants.RestaurantResponse'
        type: array
      pagination:
        $ref: '#/definitions/restaurants.Pagination'
    type: object
  restaurants.RestaurantResponse:
    properties:
      address:
        type: string
      categories:
        items:
          type: string
        type: array
      description:
        type: string
      distance:
        type: integer
      hasActiveOffers:
        type: boolean
      id:
        type: string
      imageUrl:
        type: string
      latitude:
        type: number
      longitude:
        type: number
      name:
        type: string
      phone:
        type: string
      rating:
        type: number
      reviewCount:
        type: integer
      workingHours:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API сервер для курсовой работы FoodSharing.
  title: FoodSharing App API
  version: "1.0"
paths:
  /auth/change-password:
    post:
      consumes:
      - application/json
      parameters:
      - description: Текущий и новый пароль
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/auth.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Смена пароля (авторизован)
      tags:
      - Auth
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      parameters:
      - description: Email для сброса
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/auth.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.ForgotPasswordResponse'
      summary: Запрос OTP для сброса пароля
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Данные для входа
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Вход (USER/PARTNER)
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Выход (инвалидация refresh token)
      tags:
      - Auth
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.UserResponse'
      security:
      - ApiKeyAuth: []
      summary: Текущий пользователь
      tags:
      - Auth
  /auth/oauth:
    post:
      consumes:
      - application/json
      parameters:
      - description: OAuth provider и idToken
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/auth.OAuthRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.OAuthResponse'
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.OAuthResponse'
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: OAuth вход (Google/Apple) — только USER
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.TokenResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Обновление токенов
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Данные для регистрации
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.AuthResponse'
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Регистрация USER
      tags:
      - Auth
  /auth/register/partner:
    post:
      consumes:
      - application/json
      parameters:
      - description: Данные заявки партнера
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/auth.PartnerRegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.AuthResponse'
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Регистрация PARTNER (заявка)
      tags:
      - Auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      parameters:
      - description: Reset token и новый пароль
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/auth.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Установка нового пароля
      tags:
      - Auth
  /auth/verify-reset-code:
    post:
      consumes:
      - application/json
      parameters:
      - description: Email и OTP-код
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/auth.VerifyResetCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.VerifyResetCodeResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Проверка OTP-кода
      tags:
      - Auth
  /categories:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      tags:
      - Categories
    post:
      consumes:
      - application/json
      parameters:
      - description: Данные новой категории
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/categories.CreateCategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Category'
      security:
      - ApiKeyAuth: []
      tags:
      - Admin
  /categories/{id}:
    delete:
      description: Нельзя удалить категорию, если в ней есть офферы
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: Успешное удаление без тела ответа
      security:
      - ApiKeyAuth: []
      tags:
      - Admin
    patch:
      consumes:
      - application/json
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      - description: Новые данные
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/categories.CreateCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Category'
      security:
      - ApiKeyAuth: []
      tags:
      - Admin
  /offers:
    get:
      parameters:
      - description: Latitude
        in: query
        name: lat
        type: number
      - description: Longitude
        in: query
        name: lng
        type: number
      - description: Radius
        in: query
        name: radius
        type: integer
      - description: Restaurant ID
        in: query
        name: restaurantId
        type: string
      - description: Category ID
        in: query
        name: categoryId
        type: string
      - description: Min Price
        in: query
        name: minPrice
        type: number
      - description: Max Price
        in: query
        name: maxPrice
        type: number
      - description: Sort By
        enum:
        - distance
        - price
        - pickupTime
        in: query
        name: sortBy
        type: string
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      tags:
      - Offers
  /offers/{id}:
    get:
      parameters:
      - description: Offer ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/offers.OfferDetailDTO'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      tags:
      - Offers
  /orders:
    get:
      parameters:
      - description: Status
        in: query
        name: status
        type: string
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      tags:
      - Orders
    post:
      consumes:
      - application/json
      parameters:
      - description: Данные заказа
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/orders.CreateOrderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/orders.CreateOrderResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      tags:
      - Orders
  /orders/{id}:
    get:
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/orders.OrderDetailDTO'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      tags:
      - Orders
  /orders/{id}/cancel:
    post:
      consumes:
      - application/json
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: string
      - description: Причина отмены
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/orders.CancelOrderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/orders.CancelOrderResponse'
      security:
      - ApiKeyAuth: []
      tags:
      - Orders
  /orders/{id}/pay:
    post:
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/orders.PayOrderResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      tags:
      - Orders
  /orders/me/notifications:
    get:
      description: Получение списка уведомлений пользователя с пагинацией
      parameters:
      - default: 20
        description: Лимит
        in: query
        name: limit
        type: integer
      - default: 0
        description: Смещение
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Notification'
            type: array
      security:
      - ApiKeyAuth: []
      tags:
      - Profile
  /orders/me/stats:
    get:
      description: Получение количества спасенных боксов и сэкономленных денег
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/orders.UserStatsResponse'
      security:
      - ApiKeyAuth: []
      tags:
      - Profile
  /partner/analytics:
    get:
      description: Получение статистики продаж, выручки и процента отмен за период
        с группировкой
      parameters:
      - description: Дата начала (YYYY-MM-DD)
        in: query
        name: startDate
        required: true
        type: string
      - description: Дата конца (YYYY-MM-DD)
        in: query
        name: endDate
        required: true
        type: string
      - default: day
