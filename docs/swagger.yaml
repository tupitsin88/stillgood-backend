basePath: /api/v1
definitions:
  internal_analytics.AnalyticsSummary:
    properties:
      cancelRate:
        type: number
      cancelledOrders:
        type: integer
      categoryBreakdown:
        items:
          $ref: '#/definitions/internal_analytics.CategoryStat'
        type: array
      completedOrders:
        type: integer
      conversionRate:
        type: number
      grossRevenue:
        type: number
      netPayout:
        type: number
      serviceFee:
        type: number
      totalBookings:
        type: integer
    type: object
  internal_analytics.CategoryStat:
    properties:
      grossRevenue:
        type: number
      name:
        type: string
    type: object
  internal_auth.LoginRequest:
    properties:
      device_token:
        type: string
      email:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  internal_auth.RefreshRequest:
    properties:
      refreshToken:
        type: string
    required:
    - refreshToken
    type: object
  internal_auth.RegisterRequest:
    properties:
      device_token:
        type: string
      email:
        type: string
      name:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  internal_auth.TokenResponse:
    properties:
      accessToken:
        type: string
      refreshToken:
        type: string
    type: object
  internal_auth.UserResponse:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      role:
        type: string
    type: object
  internal_offers.CategoryDTO:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  internal_offers.CreateOfferRequest:
    properties:
      categoryId:
        type: string
      description:
        type: string
      imageUrl:
        type: string
      originalPrice:
        type: number
      pickupEnd:
        type: string
      pickupStart:
        type: string
      price:
        type: number
      quantity:
        minimum: 1
        type: integer
      title:
        type: string
    required:
    - categoryId
    - originalPrice
    - pickupEnd
    - pickupStart
    - price
    - quantity
    - title
    type: object
  internal_offers.OfferDetailDTO:
    properties:
      category:
        $ref: '#/definitions/internal_offers.CategoryDTO'
      description:
        type: string
      discount:
        type: integer
      id:
        type: string
      imageUrl:
        type: string
      isActive:
        type: boolean
      originalPrice:
        type: number
      pickupEnd:
        type: string
      pickupStart:
        type: string
      price:
        type: number
      quantityAvailable:
        type: integer
      quantityTotal:
        type: integer
      restaurant:
        $ref: '#/definitions/internal_offers.RestaurantShortDTO'
      title:
        type: string
    type: object
  internal_offers.RestaurantShortDTO:
    properties:
      address:
        type: string
      id:
        type: string
      latitude:
        type: number
      longitude:
        type: number
      name:
        type: string
      phone:
        type: string
    type: object
  internal_offers.UpdateOfferRequest:
    properties:
      description:
        type: string
      isActive:
        type: boolean
      price:
        type: number
      quantity:
        type: integer
      title:
        type: string
    type: object
  internal_orders.CancelOrderRequest:
    properties:
      reason:
        type: string
    type: object
  internal_orders.CancelOrderResponse:
    properties:
      cancelledAt:
        type: string
      id:
        type: string
      refundAmount:
        type: number
      status:
        type: string
    type: object
  internal_orders.CreateOrderRequest:
    properties:
      offerId:
        type: string
    required:
    - offerId
    type: object
  internal_orders.CreateOrderResponse:
    properties:
      amount:
        type: number
      expiresAt:
        type: string
      id:
        type: string
      offer:
        $ref: '#/definitions/internal_orders.OfferShortDTO'
      restaurant:
        $ref: '#/definitions/internal_orders.RestaurantSimpleDTO'
      status:
        type: string
    type: object
  internal_orders.OfferDetailInternalDTO:
    properties:
      description:
        type: string
      discount:
        type: integer
      distance:
        type: integer
      id:
        type: string
      imageUrl:
        type: string
      originalPrice:
        type: number
      pickupEnd:
        type: string
      pickupStart:
        type: string
      price:
        type: number
      quantityAvailable:
        type: integer
      restaurantId:
        type: string
      restaurantName:
        type: string
      title:
        type: string
    type: object
  internal_orders.OfferShortDTO:
    properties:
      id:
        type: string
      pickupEnd:
        type: string
      pickupStart:
        type: string
      title:
        type: string
    type: object
  internal_orders.OrderDetailDTO:
    properties:
      amount:
        type: number
      cancellationReason:
        type: string
      cancelledAt:
        type: string
      completedAt:
        type: string
      createdAt:
        type: string
      expiresAt:
        type: string
      id:
        type: string
      offer:
        $ref: '#/definitions/internal_orders.OfferDetailInternalDTO'
      orderNumber:
        type: string
      paidAt:
        type: string
      restaurant:
        $ref: '#/definitions/internal_orders.RestaurantShortDTO'
      status:
        type: string
    type: object
  internal_orders.PayOrderResponse:
    properties:
      id:
        type: string
      orderNumber:
        type: string
      paidAt:
        type: string
      status:
        type: string
    type: object
  internal_orders.RestaurantShortDTO:
    properties:
      address:
        type: string
      id:
        type: string
      latitude:
        type: number
      longitude:
        type: number
      name:
        type: string
      phone:
        type: string
    type: object
  internal_orders.RestaurantSimpleDTO:
    properties:
      address:
        type: string
      name:
        type: string
    type: object
  internal_restaurants.RestaurantResponse:
    properties:
      address:
        type: string
      id:
        type: string
      latitude:
        type: number
      longitude:
        type: number
      name:
        type: string
      phone:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API сервер для курсовой работы FoodSharing.
  title: FoodSharing App API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Данные для входа
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/internal_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.TokenResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Вход (USER/PARTNER)
      tags:
      - Auth
  /auth/logout:
    post:
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Выход (инвалидация refresh token)
      tags:
      - Auth
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.UserResponse'
      security:
      - ApiKeyAuth: []
      summary: Текущий пользователь
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/internal_auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.TokenResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Обновление токенов
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Данные для регистрации
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/internal_auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_auth.TokenResponse'
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Регистрация USER
      tags:
      - Auth
  /categories:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Список категорий
      tags:
      - Categories
  /offers:
    get:
      parameters:
      - description: Latitude
        in: query
        name: lat
        type: number
      - description: Longitude
        in: query
        name: lng
        type: number
      - description: Radius
        in: query
        name: radius
        type: integer
      - description: Restaurant ID
        in: query
        name: restaurantId
        type: string
      - description: Category ID
        in: query
        name: categoryId
        type: string
      - description: Min Price
        in: query
        name: minPrice
        type: number
      - description: Max Price
        in: query
        name: maxPrice
        type: number
      - description: Sort By
        enum:
        - distance
        - price
        - pickupTime
        in: query
        name: sortBy
        type: string
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Список предложений
      tags:
      - Offers
  /offers/{id}:
    get:
      parameters:
      - description: Offer ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_offers.OfferDetailDTO'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Детали предложения
      tags:
      - Offers
  /orders:
    get:
      parameters:
      - description: Status
        in: query
        name: status
        type: string
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: Заказы пользователя
      tags:
      - Orders
    post:
      consumes:
      - application/json
      parameters:
      - description: Данные заказа
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/internal_orders.CreateOrderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_orders.CreateOrderResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Создание заказа
      tags:
      - Orders
  /orders/{id}:
    get:
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_orders.OrderDetailDTO'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Детали заказа
      tags:
      - Orders
  /orders/{id}/cancel:
    post:
      consumes:
      - application/json
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: string
      - description: Причина отмены
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/internal_orders.CancelOrderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_orders.CancelOrderResponse'
      security:
      - ApiKeyAuth: []
      summary: Отмена заказа
      tags:
      - Orders
  /orders/{id}/pay:
    post:
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_orders.PayOrderResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Оплата заказа
      tags:
      - Orders
  /partner/analytics:
    get:
      description: Получение статистики продаж, выручки и процента отмен за период
        с группировкой
      parameters:
      - description: Дата начала (YYYY-MM-DD)
        in: query
        name: startDate
        required: true
        type: string
      - description: Дата конца (YYYY-MM-DD)
        in: query
        name: endDate
        required: true
        type: string
      - default: day
        description: Группировка данных
        enum:
        - day
        - week
        - month
        in: query
        name: groupBy
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_analytics.AnalyticsSummary'
      security:
      - ApiKeyAuth: []
      tags:
      - Analytics
  /partner/offers:
    get:
      parameters:
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: Предложения партнёра
      tags:
      - Partner
    post:
      consumes:
      - application/json
      parameters:
      - description: Данные предложения
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/internal_offers.CreateOfferRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_offers.OfferDetailDTO'
      security:
      - ApiKeyAuth: []
      summary: Создание предложения
      tags:
      - Partner
  /partner/offers/{id}:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Offer ID
        in: path
        name: id
        required: true
        type: string
      - description: Данные для обновления
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/internal_offers.UpdateOfferRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_offers.OfferDetailDTO'
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Обновление предложения
      tags:
      - Partner
  /partner/orders:
    get:
      parameters:
      - description: Status
        enum:
        - CREATED
        - PAID
        - COMPLETED
        - CANCELLED
        in: query
        name: status
        type: string
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: Заказы партнёра
      tags:
      - Partner
  /partner/orders/{id}/complete:
    post:
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: Подтверждение выдачи
      tags:
      - Partner
  /restaurants:
    get:
      parameters:
      - description: Latitude
        in: query
        name: lat
        type: number
      - description: Longitude
        in: query
        name: lng
        type: number
      - description: Радиус в метрах
        in: query
        name: radius
        type: integer
      - description: Category ID
        in: query
        name: categoryId
        type: string
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_restaurants.RestaurantResponse'
            type: array
      summary: Список ресторанов
      tags:
      - Restaurants
  /restaurants/{id}:
    get:
      parameters:
      - description: Restaurant ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_restaurants.RestaurantResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Детали ресторана
      tags:
      - Restaurants
  /restaurants/upload:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Image file
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Загрузка изображения
      tags:
      - Restaurants
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
